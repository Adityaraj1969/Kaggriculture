name: CI Quality & Simulation Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --prefer-binary -r requirements-dev.txt

      - name: Lint with Ruff
        run: |
          python -m ruff check .

      - name: Static Type Check with Mypy
        run: |
          python -m mypy main.py src/

      - name: Run Unit Tests
        env:
          PYTHONPATH: .
        run: |
          python -m unittest discover -s tests -p "test_*.py"

      - name: Run Simulation Benchmark (3-Seed Quick Verification)
        env:
          PYTHONPATH: .
        run: |
          python tools/benchmark.py --seeds 1,2,3 --min-win-rate 1.0
